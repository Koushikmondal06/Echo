[project]
name = "prediction-market"
version = "0.1.0"
description = "Algorand Prediction Market Smart Contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "algokit-utils>=3.0.0",
    "algosdk>=2.10.0",
    "pyteal>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.algokit]
project_type = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true